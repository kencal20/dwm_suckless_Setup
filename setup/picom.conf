backend = "glx";
vsync = true;

# ===== CORNER ROUNDING =====
corner-radius = 12.0;

rounded-corners-exclude = [
  "class_g = 'dwm'",
  "class_g = 'Polybar'",
  "window_type = 'desktop'"
];

# ===== MACOS STYLE BLUR =====
blur-method = "dual_kawase";
blur-strength = 7;

blur-background-exclude = [
  "class_g = 'dwm'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ===== SHADOWS =====
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;

shadow-exclude = [
  "class_g = 'dwm'",
  "name = 'Notification'"
];

# ===== TRANSPARENCY =====
opacity-rule = [
  "85:class_g = 'st'",
  "85:class_g = 'Rofi'"
];

inactive-opacity = 0.95;
active-opacity = 0.95;
frame-opacity = 0.90;

inactive-opacity-override = false;
detect-client-opacity = true;

# ===== FADING =====
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

# ===== PERFORMANCE =====
detect-client-leader = true;
detect-transient = true;
detect-rounded-corners = true;

# ===== EXPERIMENTAL =====
experimental-backends = true;
