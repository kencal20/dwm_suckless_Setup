# Physical Rendering Backend
# Changed from 'xrender' to 'glx' for better performance and rounded-corner anti-aliasing
backend = "glx";
vsync = true;

# Window Corner Settings
corner-radius = 12.0;

# Exclude rules for corners 
# (Commented out dwm so your window borders/corners actually render)
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
  # "class_g = 'dwm'"
];

# Window Shadow Settings
shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading Animations
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Opacity and Transparency
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [ "class_g = 'Cairo-clock'" ];

# Background Blurring
blur-background = false;
blur-method = "dual_kawase";
blur-strength = 5;

# General Settings
log-level = "warn";
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; }
  dropdown_menu = { opacity = 1.0; }
};
